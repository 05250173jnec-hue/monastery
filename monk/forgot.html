    body::after {
      content: '';
      position: fixed;
      inset: 0;
      z-index: -1;
      background: linear-gradient(
        105deg,
        rgba(18, 26, 38, 0.72) 0%,
        rgba(22, 30, 42, 0.35) 55%,
        rgba(15, 22, 32, 0.6) 100%
      );
    }

    .container {
      width: 100%;
      max-width: 1120px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 48px;
    }

    /* ---------- Left Branding Section ---------- */
    .brand-section {
      max-width: 440px;
    }

    .brand-logo {
      width: 84px;
      height: 84px;
      border-radius: 50%;
      object-fit: cover;
      background: #fff;
      padding: 3px;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.3);
      margin-bottom: 24px;
    }

    .brand-title {
      font-size: clamp(32px, 4vw, 44px);
      font-weight: 800;
      letter-spacing: 1px;
      line-height: 1.15;
      text-transform: uppercase;
      margin-bottom: 10px;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.35);
    }

    .brand-subtitle {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 1.5px;
      color: #f2a900;
      text-transform: uppercase;
      margin-bottom: 18px;
    }

    .gold-divider {
      width: 100%;
      max-width: 280px;
      height: 3px;
      background: #f2a900;
      border-radius: 2px;
      margin-bottom: 20px;
    }

    .brand-desc {
      font-size: 15px;
      line-height: 1.75;
      color: rgba(255, 255, 255, 0.92);
      text-shadow: 0 1px 8px rgba(0, 0, 0, 0.45);
    }

    /* ---------- Right Floating White Card ---------- */
    .reset-card {
      width: 100%;
      max-width: 410px;
      background: #ffffff;
      color: #141824;
      border-radius: 22px;
      padding: 44px 36px 40px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.38);
    }

    .lock-badge {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: #f6f8fc;
      border: 1.5px solid #cbd7ee;
      display: grid;
      place-items: center;
      margin: 0 auto 22px;
    }

    .reset-card h2 {
      font-size: 24px;
      font-weight: 700;
      text-align: center;
      color: #111827;
      margin-bottom: 6px;
    }

    .reset-card .subtitle {
      font-size: 13.5px;
      color: #6b7280;
      text-align: center;
      margin-bottom: 28px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #374151;
      margin-bottom: 8px;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon {
      position: absolute;
      left: 14px;
      display: flex;
      align-items: center;
      color: #4f7df3;
      pointer-events: none;
    }

    .input-wrapper input {
      width: 100%;
      height: 46px;
      padding: 0 14px 0 42px;
      font: inherit;
      font-size: 14px;
      color: #1f2937;
      background: #ffffff;
      border: 1.5px solid #dbe2ef;
      border-radius: 10px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .input-wrapper input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    .helper-text {
      font-size: 13px;
      color: #6b7280;
      line-height: 1.55;
      margin-bottom: 22px;
    }

    .btn-submit {
      width: 100%;
      height: 46px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: #ffffff;
      font: inherit;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
    }

    .btn-submit:hover {
      background: #1d4ed8;
      transform: translateY(-1px);
      box-shadow: 0 8px 20px rgba(37, 99, 235, 0.3);
    }

    .back-link {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-top: 24px;
      font-size: 13.5px;
      font-weight: 600;
      color: #2563eb;
      text-decoration: none;
    }

    .back-link:hover {
      text-decoration: underline;
    }

    .status-msg {
      display: none;
      margin-top: 16px;
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 13px;
      line-height: 1.45;
      background: #ecfdf5;
      color: #065f46;
      border: 1px solid #a7f3d0;
    }

    .carousel-pill {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(20, 22, 26, 0.88);
      border-radius: 12px;
      display: flex;
      align-items: center;
      overflow: hidden;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
    }

    .carousel-pill button {
      background: none;
      border: none;
      color: #ffffff;
      width: 38px;
      height: 36px;
      font-size: 16px;
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: background 0.2s;
    }

    .carousel-pill button:hover {
      background: rgba(255, 255, 255, 0.12);
    }

    .carousel-pill span {
      width: 1px;
      height: 20px;
      background: rgba(255, 255, 255, 0.2);
    }

    @media (max-width: 860px) {
      .container {
        flex-direction: column;
        text-align: center;
      }

      .brand-logo {
        margin: 0 auto 18px;
      }

      .gold-divider {
        margin: 0 auto 18px;
      }

      <h2>Forgot Password</h2>
      <p class="subtitle">Enter your email to reset</p>

      <form id="forgotForm" onsubmit="handleReset(event)">
        <div class="form-group">
          <label for="resetEmail">Email Address</label>
          <div class="input-wrapper">
            <span class="input-icon">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="5" width="18" height="14" rx="2"/>
                <polyline points="3 7 12 13 21 7"/>
              </svg>
            </span>
            <input
              type="email"
              id="resetEmail"
              placeholder="participant@monastery.bt"
              required
            >
          </div>
        </div>

        <p class="helper-text">
          We will send a password<br>
          reset link to your email.
        </p>

        <button type="submit" class="btn-submit">Send Reset Link</button>

        <div id="statusMsg" class="status-msg"></div>
      </form>

      <a href="monk-login.html" class="back-link">&larr; Back to Login</a>
    </section>

  <script>
    function handleReset(e) {
      e.preventDefault();
      const email = document.getElementById('resetEmail').value.trim();
      const status = document.getElementById('statusMsg');
      status.textContent = `A password reset link has been sent to ${email}. Please check your inbox.`;
      status.style.display = 'block';
    }
  </script>
