<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Users - Admin</title>
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <div class="admin-dashboard">
    <div id="sidebarMount"></div>
    <main class="admin-main-content">
      <div id="topbarMount"></div>

      <div class="page-header">
        <div><h1>User Management</h1><p>Manage all system users</p></div>
        <button class="btn btn-primary" onclick="openUserModal()">+ Add New User</button>
      </div>

      <div class="stats-grid" style="grid-template-columns:repeat(4,1fr);">
        <div class="stat-card"><div class="stat-value" id="uTotal">0</div><div class="stat-label">Total Users</div></div>
        <div class="stat-card"><div class="stat-value" id="uMonks" style="color:#8b5cf6;">0</div><div class="stat-label">Monks</div></div>
        <div class="stat-card"><div class="stat-value" id="uPart" style="color:#2563eb;">0</div><div class="stat-label">Participants</div></div>
        <div class="stat-card"><div class="stat-value" id="uActive" style="color:#22c55e;">0</div><div class="stat-label">Active</div></div>
      </div>

      <div class="search-bar">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchUser" placeholder="Search users..." oninput="renderUsers()">
      </div>

      <div class="table-container">
        <table>
          <thead>
            <tr><th>User</th><th>Role</th><th>Monastery</th><th>Joined</th><th>Status</th><th>Actions</th></tr>
          </thead>
          <tbody id="usersTable"></tbody>
        </table>
      </div>
    </main>
  </div>

  <script src="js/admin-data.js"></script>
  <script src="js/admin-auth.js"></script>
  <script src="js/admin-app.js"></script>
  <script>
    if (!AdminDB.isLoggedIn()) window.location.href = 'admin-login.html';
    document.getElementById('sidebarMount').innerHTML = renderAdminSidebar('users');
    

    function renderUsers() {
      const users = AdminDB.getUsers();
      document.getElementById('uTotal').textContent = users.length;
      document.getElementById('uMonks').textContent = users.filter(u => u.role === 'monk').length;
      document.getElementById('uPart').textContent = users.filter(u => u.role === 'participant').length;
      document.getElementById('uActive').textContent = users.length;

      const q = document.getElementById('searchUser').value.toLowerCase();
      const filtered = q ? users.filter(u => u.name.toLowerCase().includes(q) || u.email.toLowerCase().includes(q)) : users;

      document.getElementById('usersTable').innerHTML = filtered.map(u => {
        const initials = u.name.split(' ').map(n=>n[0]).join('').substring(0,2).toUpperCase();
        return `
          <tr>
            <td>
              <div style="display:flex; align-items:center; gap:10px;">
                <div style="width:38px; height:38px; border-radius:50%; background:#2563eb; color:white; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px;">${initials}</div>
                <div>
                  <div style="font-weight:700;">${u.name}</div>
                  <div style="font-size:11px; color:#94a3b8;">${u.email}</div>
                </div>
              </div>
            </td>
            <td><span class="badge ${u.role === 'monk' ? 'badge-purple' : 'badge-info'}">${u.role}</span></td>
            <td>${u.monastery || '-'}</td>
            <td>${AdminDB.formatDate(u.joinDate)}</td>
            <td><span class="badge badge-success">Active</span></td>
            <td>
              <div style="display:flex; gap:4px;">
                <button class="btn-icon" onclick='openUserModal(${JSON.stringify(u).replace(/'/g, "&apos;")})' title="Edit">✏️</button>
                <button class="btn-icon danger" onclick="deleteUser('${u.id}')" title="Delete">🗑️</button>
              </div>
            </td>
          </tr>
        `;
      }).join('') || `<tr><td colspan="6"><div class="empty-state"><p>No users found</p></div></td></tr>`;
    }

    function openUserModal(user = null) {
      const isEdit = !!user;
      const u = user || { name: '', email: '', phone: '', monastery: '', role: 'participant' };
      openModal('userModal', `
        <div class="modal">
          <div class="modal-header">
            <h3>${isEdit ? 'Edit User' : 'Add User'}</h3>
            <button class="modal-close" onclick="closeModal('userModal')">✕</button>
          </div>
          <div class="modal-body">
            <div class="form-group"><label>Full Name</label>
              <div class="input-wrapper"><span class="input-icon">👤</span><input type="text" id="uName" value="${u.name}"></div>
            </div>
            <div class="form-group"><label>Email</label>
              <div class="input-wrapper"><span class="input-icon">✉️</span><input type="email" id="uEmail" value="${u.email}"></div>
            </div>
            ${!isEdit ? `
              <div class="form-group"><label>Password</label>
                <div class="input-wrapper"><span class="input-icon">🔒</span><input type="password" id="uPassword" placeholder="Leave empty for default123"></div>
              </div>
            ` : ''}
            <div class="form-row">
              <div class="form-group"><label>Phone</label>
                <div class="input-wrapper"><span class="input-icon">📱</span><input type="tel" id="uPhone" value="${u.phone || ''}"></div>
              </div>
              <div class="form-group"><label>Monastery</label>
                <div class="input-wrapper"><span class="input-icon">🏛️</span><input type="text" id="uMonastery" value="${u.monastery || ''}"></div>
              </div>
            </div>
            <div class="form-group"><label>Role</label>
              <div class="input-wrapper"><span class="input-icon">🏷️</span>
                <select id="uRole">
                  <option value="participant" ${u.role === 'participant' ? 'selected' : ''}>Participant</option>
                  <option value="monk" ${u.role === 'monk' ? 'selected' : ''}>Monk</option>
                </select>
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button class="btn btn-outline" onclick="closeModal('userModal')">Cancel</button>
            <button class="btn btn-primary" onclick="saveUser('${u.id || ''}')">${isEdit ? 'Save' : 'Add User'}</button>
          </div>
        </div>
      `);
    }

    function saveUser(id) {
      const data = {
        name: document.getElementById('uName').value.trim(),
        email: document.getElementById('uEmail').value.trim(),
        phone: document.getElementById('uPhone').value.trim(),
        monastery: document.getElementById('uMonastery').value.trim(),
        role: document.getElementById('uRole').value
      };
      const pwd = document.getElementById('uPassword')?.value;
      if (pwd) data.password = pwd;
      if (!data.name || !data.email) { showToast('Name and email required', 'error'); return; }

      if (id) {
        AdminDB.updateUser(id, data);
        showToast('User updated', 'success');
      } else {
        const res = AdminDB.addUser(data);
        if (!res.success) { showToast(res.message, 'error'); return; }
        showToast('User added', 'success');
      }
      closeModal('userModal');
      renderUsers();
    }

    function deleteUser(id) {
      if (confirm('Delete this user? Their registrations will remain but be orphaned.')) {
        AdminDB.deleteUser(id);
        showToast('User deleted', 'warning');
        renderUsers();
      }
    }

    renderUsers();
  </script>
</body>
</html>
